{% load i18n %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ stream.game.title }} - {% trans "Transmissão Ao Vivo" %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0d14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top bar minimalista da transmissão */
        .stream-header {
            background: linear-gradient(180deg, rgba(20, 22, 32, 0.95) 0%, rgba(12, 13, 20, 0.85) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .live-badge {
            background-color: #e50914;
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .game-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-teams {
            font-size: 0.85rem;
            color: #9da3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .status-badge {
            font-size: 0.82rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease;
        }

        .btn-action:hover {
            background: #1d4ed8;
        }

        /* Área de vídeo principal */
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video#remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            display: block;
        }

        /* Overlay de aviso de áudio (se autoplay bloquear som) */
        .audio-overlay {
            display: none;
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .audio-overlay:hover {
            background: rgba(30, 30, 30, 0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>
    <!-- Barra superior exclusiva da transmissão -->
    <header class="stream-header">
        <div class="game-info">
            <span class="live-badge">
                <span class="live-dot"></span>
                {% trans "AO VIVO" %}
            </span>
            <div>
                <div class="game-title">{{ stream.game.title }}</div>
                <div class="game-teams">{{ stream.game.team_a }} vs {{ stream.game.team_b }} • {{ stream.host.username }}</div>
            </div>
        </div>

        <div class="header-actions">
            <span class="status-badge" id="status-container">
                <span id="status">{% trans "Conectando..." %}</span>
            </span>
            <button id="retryBtn" class="btn-action" style="display: none;" onclick="manualRetry()">
                🔄 {% trans "Reconectar" %}
            </button>
        </div>
    </header>

    <!-- Player de Vídeo -->
    <main class="video-container">
        <video id="remoteVideo" autoplay playsinline controls></video>
        <div id="unmuteNotice" class="audio-overlay" onclick="enableAudio()">
            🔇 {% trans "Clique aqui para ativar o áudio" %}
        </div>
    </main>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const streamId = "{{ stream.id }}";
        const hostPeerId = "futstream_host_" + streamId;

        const statusEl = document.getElementById('status');
        const retryBtn = document.getElementById('retryBtn');
        const videoEl = document.getElementById('remoteVideo');
        const unmuteNotice = document.getElementById('unmuteNotice');

        function enableAudio() {
            videoEl.muted = false;
            unmuteNotice.style.display = "none";
            statusEl.innerText = "Ao Vivo 🔊";
        }

        let peer = null;
        let currentCall = null;
        let reconnectTimer = null;

        const iceServersConfig = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            {
                urls: 'turn:openrelay.metered.ca:443',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            },
            {
                urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            },
            {
                urls: 'turn:relay.metered.ca:443',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            }
        ];

        function initPeer() {
            if (peer && !peer.destroyed) {
                try { peer.destroy(); } catch (e) {}
            }

            const myPeerId = "futstream_viewer_" + Math.floor(Math.random() * 1000000);
            console.log("🚀 Inicializando Peer com ID:", myPeerId);

            peer = new Peer(myPeerId, {
                debug: 1,
                pingInterval: 5000,
                config: {
                    'iceTransportPolicy': 'all',
                    'iceServers': iceServersConfig
                }
            });

            peer.on('open', (id) => {
                console.log("✅ Conectado à rede PeerJS com ID:", id);
                connectToStream();
            });

            peer.on('disconnected', () => {
                console.warn("⚠️ Desconectado do servidor de sinalização. Reconectando...");
                statusEl.innerText = "Reconectando rede...";
                if (peer && !peer.destroyed) {
                    peer.reconnect();
                }
            });

            peer.on('error', (err) => {
                console.error("❌ Peer Error:", err);
                retryBtn.style.display = "inline-flex";

                if (err.type === 'network') {
                    statusEl.innerText = "Reconectando à rede...";
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(() => {
                        if (peer && !peer.destroyed) {
                            if (peer.disconnected) {
                                peer.reconnect();
                            } else {
                                connectToStream();
                            }
                        } else {
                            initPeer();
                        }
                    }, 3000);
                } else if (err.type === 'peer-unavailable') {
                    statusEl.innerText = "Transmissão ainda não iniciada ou offline";
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(() => {
                        if (statusEl.innerText.includes("offline") || statusEl.innerText.includes("não iniciada")) {
                            connectToStream();
                        }
                    }, 5000);
                } else {
                    statusEl.innerText = "Erro: " + err.type;
                }
            });
        }

        function manualRetry() {
            console.log("🔄 Tentativa de reconexão manual");
            statusEl.innerText = "Reconectando...";
            retryBtn.style.display = "none";

            if (!peer || peer.destroyed) {
                initPeer();
            } else if (peer.disconnected) {
                peer.reconnect();
            } else {
                connectToStream();
            }
        }

        // Inicia o Peer ao abrir a página
        initPeer();

        function connectToStream() {
            if (!peer || peer.destroyed || peer.disconnected) {
                console.warn("⚠️ Peer não está pronto para conectar, tentando restabelecer...");
                manualRetry();
                return;
            }

            statusEl.innerText = "Conectando...";
            retryBtn.style.display = "none";
            unmuteNotice.style.display = "none";
            console.log("🔄 Initiating call to " + hostPeerId);

            if (currentCall) {
                console.log("🔌 Closing previous call");
                currentCall.close();
            }

            const canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            const canvasStream = canvas.captureStream(1);

            const callObj = peer.call(hostPeerId, canvasStream, {
                metadata: { viewer: true },
                constraints: {
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                }
            });

            if (!callObj) {
                console.error("❌ Call object creation failed!");
                statusEl.innerText = "Falha ao conectar";
                retryBtn.style.display = "inline-flex";
                return;
            }

            currentCall = callObj;

            callObj.peerConnection.onconnectionstatechange = () => {
                const state = callObj.peerConnection.connectionState;
                console.log("🔗 Connection State: " + state);

                if (state === 'connected') {
                    console.log("✅ WebRTC connection established!");
                } else if (state === 'failed') {
                    console.warn("⚠️ Connection failed, attempting ICE restart...");
                    try {
                        callObj.peerConnection.restartIce();
                    } catch (e) {
                        console.warn("⚠️ ICE restart failed, will retry connection:", e);
                        setTimeout(() => connectToStream(), 1000);
                    }
                } else if (state === 'disconnected') {
                    console.warn("⚠️ Desconectado temporariamente, aguardando...");
                } else if (state === 'closed') {
                    statusEl.innerText = "Stream encerrado";
                }
            };

            callObj.peerConnection.oniceconnectionstatechange = () => {
                const state = callObj.peerConnection.iceConnectionState;
                console.log("🧊 ICE State: " + state);

                if (state === 'failed') {
                    console.warn("🧊 ICE failed, attempting restart...");
                    try {
                        callObj.peerConnection.restartIce();
                        statusEl.innerText = "Reconectando...";
                    } catch (e) {
                        console.warn("⚠️ ICE restart failed, will retry connection:", e);
                        statusEl.innerText = "Conexão perdida (ICE falhou)";
                        retryBtn.style.display = "inline-flex";
                    }
                } else if (state === 'disconnected') {
                    console.warn("⚠️ ICE desconectado temporariamente, aguardando...");
                } else if (state === 'connected' || state === 'completed') {
                    retryBtn.style.display = "none";
                }
            };

            const connectionTimeout = setTimeout(() => {
                if (statusEl.innerText === "Conectando...") {
                    statusEl.innerText = "Host não respondeu (Timeout)";
                    retryBtn.style.display = "inline-flex";
                    console.warn("⏱️ Connection timed out.");
                }
            }, 15000);

            callObj.on('stream', (remoteStream) => {
                clearTimeout(connectionTimeout);
                console.log("✅ Received remote stream!");

                const audioTracks = remoteStream.getAudioTracks();
                const videoTracks = remoteStream.getVideoTracks();
                const hasAudio = audioTracks.length > 0;
                const hasVideo = videoTracks.length > 0;

                if (!hasVideo) {
                    console.error("❌ No video tracks in stream!");
                    statusEl.innerText = "Stream sem vídeo";
                    return;
                }

                statusEl.innerText = `Ao Vivo ${hasAudio ? '🔊' : '🔇'}`;
                videoEl.srcObject = remoteStream;

                videoEl.muted = false;
                const playPromise = videoEl.play();

                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log("✅ Video playing with audio");
                    }).catch(error => {
                        console.warn("⚠️ Autoplay with audio prevented:", error);
                        videoEl.muted = true;
                        videoEl.play().then(() => {
                            console.log("✅ Video playing (muted fallback)");
                            statusEl.innerText = "Ao Vivo 🔇";
                            unmuteNotice.style.display = "block";
                        }).catch(e => {
                            console.error("❌ Autoplay failed completely:", e);
                            statusEl.innerText = "Clique no vídeo para iniciar";
                        });
                    });
                }

                remoteStream.getTracks().forEach(track => {
                    track.onended = () => {
                        console.log(`⚠️ Track ended: ${track.kind}`);
                        statusEl.innerText = "Stream encerrado";
                    };
                });
            });

            callObj.on('close', () => {
                statusEl.innerText = "Stream encerrado";
                console.log("🔌 Call closed");
            });

            callObj.on('error', (err) => {
                clearTimeout(connectionTimeout);
                console.error("❌ Call Error:", err);
                statusEl.innerText = "Erro na chamada";
                retryBtn.style.display = "inline-flex";
            });

            const conn = peer.connect(hostPeerId);
            conn.on('open', () => {
                console.log("✅ Data connection opened");
                conn.send({
                    type: 'join',
                    username: "{{ user.username|escapejs }}"
                });
            });
            conn.on('error', (err) => {
                console.error("❌ Data connection error:", err);
            });
        }
    </script>
</body>
</html>
