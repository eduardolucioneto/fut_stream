{% extends 'base.html' %}

{% block content %}
<div class="container" style="text-align: center; padding-top: 50px;">
    <div class="form-card"
        style="max-width: 600px; margin: 0 auto; border-left: 6px solid #dc3545; border-right: 6px solid #dc3545;">
        <h2 style="color: #dc3545;">Acesso Expirado</h2>
        <p style="font-size: 1.2rem; margin: 20px 0;">
            Sua conta expirou. Por favor, entre em contato com o administrador para renovar seu acesso.
        </p>
        <a href="{% url 'contact' %}" class="btn-primary">Entrar em Contato</a>
    </div>
</div>
{% endblock %}
