<script>
    function createPeerLogger(write) {
        return (level, ...parts) => {
            if (parts[0] === 'Socket closed.') {
                const event = parts[1] || {};
                write(`WebSocket fechado: codigo=${event.code}; motivo=${event.reason || 'nao informado'}; limpo=${event.wasClean}`);
            } else if (parts[0] === 'Socket open') {
                write('WebSocket de sinalizacao aberto');
            } else if (level === 1) {
                write(parts.map(part => typeof part === 'string' ? part : (part?.message || 'erro')).join(' '));
            }
        };
    }

    function attachPeerSignaling(peer, callbacks) {
        const MAX_ATTEMPTS = 5;
        let attempts = 0;
        let retryTimer = null;
        let openTimer = null;
        let stableTimer = null;
        let stopped = false;

        function clearTimers() {
            clearTimeout(retryTimer);
            clearTimeout(openTimer);
            clearTimeout(stableTimer);
            retryTimer = openTimer = stableTimer = null;
        }

        function waitForOpen() {
            clearTimeout(openTimer);
            openTimer = setTimeout(() => {
                if (stopped || peer.open) return;
                if (!peer.destroyed) peer.disconnect();
                scheduleReconnect();
            }, 15000);
        }

        function scheduleReconnect() {
            if (stopped || retryTimer !== null) return;
            clearTimeout(openTimer);
            clearTimeout(stableTimer);
            if (peer.destroyed || attempts >= MAX_ATTEMPTS) {
                callbacks.onUnavailable();
                return;
            }
            const delay = Math.min(2000 * (2 ** attempts), 15000);
            attempts += 1;
            callbacks.onRetry(attempts, MAX_ATTEMPTS);
            retryTimer = setTimeout(() => {
                retryTimer = null;
                if (stopped) return;
                if (peer.destroyed) {
                    callbacks.onUnavailable();
                    return;
                }
                if (peer.open) return;
                try {
                    if (peer.disconnected) peer.reconnect();
                    waitForOpen();
                } catch (error) {
                    callbacks.log(`Sinalizacao: ${error.message}`);
                    scheduleReconnect();
                }
            }, delay);
        }

        peer.on('open', (id) => {
            if (stopped) return;
            clearTimers();
            // A briefly opened socket must not reset the retry limit.
            stableTimer = setTimeout(() => { attempts = 0; }, 30000);
            callbacks.onOpen(id);
        });
        peer.on('disconnected', scheduleReconnect);
        peer.on('error', (error) => {
            if (stopped) return;
            callbacks.log(`PeerJS ${error.type}: ${error.message}`);
            if (['network', 'socket-error', 'socket-closed', 'server-error'].includes(error.type)) {
                scheduleReconnect();
            } else {
                callbacks.onError(error);
            }
        });
        waitForOpen();

        return {
            retry() {
                clearTimers();
                attempts = 0;
                scheduleReconnect();
            },
            stop() {
                stopped = true;
                clearTimers();
            }
        };
    }
</script>
