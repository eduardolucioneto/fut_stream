{% extends 'base.html' %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Card wrapper to match site visuals (gold accents on sides) */
    .ladder-card { max-width: 980px; margin: 18px auto; padding: 0; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); border-left:6px solid rgba(255,193,7,0.95); border-right:6px solid rgba(255,193,7,0.65); }

    /* Preserve the ladder's darker theme inside a card so it blends with the site */
    .ladder-inner { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 20px; color:#fff; border-radius: 8px; }

    .ladder-wrapper { max-width: 900px; margin: 0 auto; }

    .ladder-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .ladder-header h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .controls-section {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 15px;
        align-items: end;
    }

    .control-group {
        display: flex;
        flex-direction: column;
    }

    .control-label {
        font-size: 0.9rem;
        color: #a0aec0;
        margin-bottom: 8px;
        font-weight: 500;
    }

    .control-select,
    .control-input {
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        transition: all .3s ease;
    }

    .control-select:focus,
    .control-input:focus {
        outline: none;
        border-color: #667eea;
        background: rgba(255, 255, 255, 0.12);
    }

    .btn-clear {
        padding: 12px 25px;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all .3s ease;
    }

    .btn-clear:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 87, 108, .3);
    }

    .ladder-table-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-height: 600px;
        overflow-y: auto;
    }

    .ladder-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 2px;
    }

    .ladder-table th {
        position: sticky;
        top: 0;
        background: #1a1a2e;
        padding: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #a0aec0;
        text-align: center;
    }

    .ladder-table td {
        padding: 8px;
        text-align: center;
        font-weight: 500;
        font-size: 0.95rem;
    }

    .back-cell {
        background: linear-gradient(135deg, #ff6b9d 0%, #ffa8c5 100%);
        color: #fff;
        cursor: pointer;
        transition: .2s;
        border-radius: 5px;
    }

    .back-cell:hover {
        background: linear-gradient(135deg, #ff5588 0%, #ff9ab8 100%);
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(255, 107, 157, .4);
    }

    .lay-cell {
        background: linear-gradient(135deg, #6dd5ed 0%, #2193b0 100%);
        color: #fff;
        cursor: pointer;
        transition: .2s;
        border-radius: 5px;
    }

    .lay-cell:hover {
        background: linear-gradient(135deg, #5bc5dd 0%, #1a83a0 100%);
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(109, 213, 237, .4);
    }

    .odd-cell {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-weight: 600;
    }

    .pl-cell {
        background: rgba(255, 255, 255, 0.05);
        color: #a0aec0;
        font-weight: 600;
    }

    .pl-cell.positive {
        color: #48bb78;
        background: rgba(72, 187, 120, .1);
    }

    .pl-cell.negative {
        color: #f56565;
        background: rgba(245, 101, 101, .1);
    }

    .summary-section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
    }

    .summary-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        color: #a0aec0;
    }

    .summary-value {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .summary-value.positive {
        color: #48bb78;
    }

    .summary-value.negative {
        color: #f56565;
    }

    .bets-list {
        margin-top: 10px;
        max-height: 150px;
        overflow-y: auto;
    }

    .bet-item {
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        margin-bottom: 5px;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
    }

    .bet-item.back {
        border-left: 3px solid #ff6b9d;
    }

    .bet-item.lay {
        border-left: 3px solid #6dd5ed;
    }

    @media (max-width:768px) {
        .controls-grid {
            grid-template-columns: 1fr;
        }

        .summary-section {
            grid-template-columns: 1fr;
        }
    }

    .ladder-table-container::-webkit-scrollbar,
    .bets-list::-webkit-scrollbar {
        width: 8px;
    }

    .ladder-table-container::-webkit-scrollbar-track,
    .bets-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }

    .ladder-table-container::-webkit-scrollbar-thumb,
    .bets-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }

    .ladder-table-container::-webkit-scrollbar-thumb:hover,
    .bets-list::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
    }
</style>

<div class="ladder-card">
    <div class="ladder-inner">
        <div class="ladder-wrapper">
        <div class="ladder-header">
            <h1>⚽ Calculadora Ladder</h1>
        </div>
        <div class="controls-section">
            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label">Aposta com:</label>
                    <select id="betType" class="control-select">
                        <option value="stake">Stake</option>
                        <option value="responsability">Responsabilidade</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Valor (R$):</label>
                    <input type="number" id="betValue" class="control-input" placeholder="100.00" step="0.01" min="0"
                        value="100.00" />
                </div>
                <button class="btn-clear" onclick="clearAllBets()">Limpar Tudo</button>
            </div>
        </div>
        <div class="ladder-table-container">
            <table class="ladder-table">
                <thead>
                    <tr>
                        <th>Back</th>
                        <th>Odd</th>
                        <th>Lay</th>
                        <th>P/L</th>
                    </tr>
                </thead>
                <tbody id="ladderBody"><!-- rows generated by JS --></tbody>
            </table>
        </div>
        <div class="summary-section">
            <div class="summary-card">
                <div class="summary-title">Back Vencedor</div>
                <div class="summary-value" id="backWinner">R$ 0,00</div>
                <div class="summary-title" style="margin-top:15px;">Backs</div>
                <div class="bets-list" id="backsList">
                    <div style="color:#718096;font-size:0.85rem;">Nenhuma aposta Back</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Lay Vencedor</div>
                <div class="summary-value" id="layWinner">R$ 0,00</div>
                <div class="summary-title" style="margin-top:15px;">Lays</div>
                <div class="bets-list" id="laysList">
                    <div style="color:#718096;font-size:0.85rem;">Nenhuma aposta Lay</div>
                </div>
            </div>
        </div>
        </div>
    </div>
</div>

<script>
    let backBets = [];
    let layBets = [];
    function generateOdds() {
        const odds = [];
        for (let i = 101; i <= 200; i++) odds.push(i / 100);
        for (let i = 202; i <= 300; i += 2) odds.push(i / 100);
        for (let i = 305; i <= 400; i += 5) odds.push(i / 100);
        for (let i = 41; i <= 60; i++) odds.push(i / 10);
        for (let i = 62; i <= 100; i += 2) odds.push(i / 10);
        for (let i = 105; i <= 200; i += 5) odds.push(i / 10);
        for (let i = 21; i <= 30; i++) odds.push(i);
        for (let i = 32; i <= 50; i += 2) odds.push(i);
        for (let i = 55; i <= 100; i += 5) odds.push(i);
        for (let i = 110; i <= 1000; i += 10) odds.push(i);
        return odds.reverse();
    }
    function formatCurrency(v) { return 'R$ ' + v.toFixed(2).replace('. ', ','); }
    function calculatePL(odd) {
        let pl = 0;
        backBets.forEach(b => { pl += b.stake * (b.odd - odd) / odd; });
        layBets.forEach(b => { pl += b.stake * (odd - b.odd) / odd; });
        return pl;
    }
    function renderLadder() {
        const odds = generateOdds();
        const tbody = document.getElementById('ladderBody');
        tbody.innerHTML = '';
        odds.forEach(o => {
            const pl = calculatePL(o);
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="back-cell" onclick="placeBet('back',${o})"></td>
                <td class="odd-cell">${o.toFixed(2)}</td>
                <td class="lay-cell" onclick="placeBet('lay',${o})"></td>
                <td class="pl-cell ${pl > 0 ? 'positive' : pl < 0 ? 'negative' : ''}">${formatCurrency(pl)}</td>
            `;
            tbody.appendChild(row);
        });
    }
    function placeBet(type, odd) {
        const val = parseFloat(document.getElementById('betValue').value) || 0;
        const betType = document.getElementById('betType').value;
        if (val <= 0) { alert('Por favor, insira um valor válido'); return; }
        let stake = val;
        if (betType === 'responsability' && type === 'lay') stake = val / (odd - 1);
        if (type === 'back') backBets.push({ odd, stake }); else layBets.push({ odd, stake });
        updateDisplay();
    }
    function updateDisplay() { renderLadder(); updateSummary(); updateBetsList(); }
    function updateSummary() {
        const odds = generateOdds();
        let maxBack = -Infinity, maxLay = -Infinity;
        odds.forEach(o => {
            const pl = calculatePL(o);
            if (backBets.some(b => Math.abs(b.odd - o) < 0.001)) maxBack = Math.max(maxBack, pl);
            if (layBets.some(b => Math.abs(b.odd - o) < 0.001)) maxLay = Math.max(maxLay, pl);
        });
        if (backBets.length === 0) maxBack = 0;
        if (layBets.length === 0) maxLay = 0;
        const backEl = document.getElementById('backWinner');
        const layEl = document.getElementById('layWinner');
        backEl.textContent = formatCurrency(maxBack);
        layEl.textContent = formatCurrency(maxLay);
        backEl.className = 'summary-value ' + (maxBack > 0 ? 'positive' : maxBack < 0 ? 'negative' : '');
        layEl.className = 'summary-value ' + (maxLay > 0 ? 'positive' : maxLay < 0 ? 'negative' : '');
    }
    function updateBetsList() {
        const backs = document.getElementById('backsList');
        const lays = document.getElementById('laysList');
        if (backBets.length === 0) backs.innerHTML = '<div style="color:#718096;font-size:0.85rem;">Nenhuma aposta Back</div>';
        else backs.innerHTML = backBets.map(b => `<div class="bet-item back"><span>Odd ${b.odd.toFixed(2)}</span><span>${formatCurrency(b.stake)}</span></div>`).join('');
        if (layBets.length === 0) lays.innerHTML = '<div style="color:#718096;font-size:0.85rem;">Nenhuma aposta Lay</div>';
        else lays.innerHTML = layBets.map(b => `<div class="bet-item lay"><span>Odd ${b.odd.toFixed(2)}</span><span>${formatCurrency(b.stake)}</span></div>`).join('');
    }
    function clearAllBets() { backBets = []; layBets = []; updateDisplay(); }
    function scrollToOdd(target) {
        const rows = document.querySelectorAll('#ladderBody tr');
        for (const r of rows) {
            const cell = r.querySelector('.odd-cell');
            if (cell && Math.abs(parseFloat(cell.textContent) - target) < 0.001) {
                r.scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
            }
        }
    }
    // Initialize
    renderLadder();
    scrollToOdd(10);
</script>
{% endblock %}
